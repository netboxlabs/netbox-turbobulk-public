name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,parquet]

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check formatting with black
        run: |
          black --check src/ tests/ scripts/

      - name: Check import sorting with isort
        run: |
          isort --check-only src/ tests/ scripts/

      - name: Type check with mypy
        run: |
          mypy src/

  # Standalone so an unrelated lint failure cannot skip it, and because it is
  # stdlib-only and needs no install. 3.12: tomllib needs 3.11+, and unittest
  # only exits non-zero on "no tests ran" from 3.12.
  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Version consistency check
        run: |
          python scripts/check_version_consistency.py

      # Runs even when the check above fails -- that is exactly when you want
      # to know whether the checker is broken or the versions really drifted.
      # `!cancelled()` rather than `always()`, which would also keep the runner
      # busy after a cancellation.
      - name: Version-check unit tests
        if: ${{ !cancelled() }}
        run: |
          python -m unittest scripts.test_check_version_consistency -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build

      - name: Build package
        run: |
          python -m build

      - name: Check package
        run: |
          pip install twine
          twine check dist/*
